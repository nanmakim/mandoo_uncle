<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ManDoo Uncle Complete Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #f0f0f0; }
    </style>
</head>
<body>
    <script>
        // 이미지 변수 선언[cite: 3]
        let imgUncleIdle, imgUncleAngry, imgUncleCry, imgUncleOpen;[cite: 3]
        let imgMandoo, imgGolden, imgShoes;[cite: 3]
        let imgPlate; [cite: 3]
        let imgTable;[cite: 3]
        let imgBoard; [cite: 3]
        
        // 젓가락 변수 선언[cite: 3]
        let imgChopstick1, imgChopstick2;[cite: 3]

        // 전광판 관련 변수[cite: 3]
        let marqueeX;[cite: 3]
        let marqueeText = " 출출하구먼...                     꼬르륵~~                     젓가락은 뒀다가 뭐해?"; [cite: 3]

        // 게임 상태 관리 변수[cite: 3]
        let foodPos;[cite: 3]
        let platePos;[cite: 3]
        let isDragging = false;[cite: 3]
        let currentFood = "mandoo"; [cite: 3]
        let faceStatus = "idle";    [cite: 3]
        let isMouthOpen = false;    [cite: 3]
        let isEatingActive = false; [cite: 3]
        let actionTimer = 0;        [cite: 3]

        // 젓가락 제어용 상태 변수들[cite: 3]
        let hasFood = false;       [cite: 3]
        let chopstickPos;          [cite: 3]

        function preload() {[cite: 3]
            imgUncleIdle = loadImage('uncle_idle.png');     [cite: 3]
            imgUncleAngry = loadImage('uncle_angry.png');   [cite: 3]
            imgUncleCry = loadImage('uncle_cry.png');       [cite: 3]
            imgUncleOpen = loadImage('uncle_open.png');     [cite: 3]
            
            imgMandoo = loadImage('food_mandoo.png');       [cite: 3]
            imgGolden = loadImage('food_golden.png');       [cite: 3]
            imgShoes = loadImage('food_shoes.png');         [cite: 3]
            imgPlate = loadImage('plate.png');     [cite: 3]
            imgTable = loadImage('table_o.png');[cite: 3]
            
            imgChopstick1 = loadImage('chopstick_1.png');   [cite: 3]
            imgChopstick2 = loadImage('chopstick_2.png');[cite: 3]
            
            // 💡 혹시 모를 에러를 방지하기 위해 안전장치를 달고, 소문자 board.png로 파일명을 시도합니다.
            imgBoard = loadImage('board.png', 
                () => { console.log("게시판 로드 성공!"); },
                () => { console.log("경고: board.png를 찾을 수 없습니다. 대소문자나 파일명을 확인하세요."); }
            ); 
        }[cite: 3]

        function setup() {[cite: 3]
            createCanvas(windowWidth, windowHeight);[cite: 3]
            marqueeX = width; [cite: 3]
            
            // 초기 위치 벡터 할당[cite: 3]
            platePos = createVector(width - 500, height - 200);[cite: 3]
            foodPos = createVector(platePos.x, platePos.y - 15);[cite: 3]
            chopstickPos = createVector(platePos.x + 30, platePos.y - 40);[cite: 3]
            
            imageMode(CENTER); [cite: 3]
        }[cite: 3]

        function draw() {[cite: 3]
            // 만약 setup이 비정상적으로 스킵되었다면 실행 안 되게 방어
            if (!chopstickPos || !platePos || !foodPos) return;

            if (faceStatus === "angry" && isEatingActive) {[cite: 3]
                background(255, 100, 100); [cite: 3]
            } else if (faceStatus === "cry" && isEatingActive) {[cite: 3]
                background(255, 235, 100); [cite: 3]
            } else {
                background(154, 206, 119); [cite: 3]
            }

            let centerX = width / 2 - 100;[cite: 3]
            let centerY = height / 2 - 40;[cite: 3]

            if (isEatingActive) {[cite: 3]
                if (millis() - actionTimer > 2000) {[cite: 3]
                    isEatingActive = false;[cite: 3]
                    faceStatus = "idle";[cite: 3]
                    resetFood(); [cite: 3]
                }
            }

            if (isDragging) {[cite: 3]
                chopstickPos.set(mouseX, mouseY);[cite: 3]
                
                if (!hasFood) {[cite: 3]
                    let dToFood = dist(chopstickPos.x, chopstickPos.y, foodPos.x, foodPos.y);[cite: 3]
                    if (dToFood < 40) {[cite: 3]
                        hasFood = true;[cite: 3]
                        marqueeText = " 오오? 오는건가?                    얼른 줘!                      이봐! 턱 빠지겠어!";[cite: 3]
                        marqueeX = width - 300; [cite: 3]
                    }
                } else {[cite: 3]
                    foodPos.set(chopstickPos.x - 30, chopstickPos.y + 30);[cite: 3]
                }
            }

            if (isDragging && hasFood && !isEatingActive) {[cite: 3]
                let dToMouth = dist(foodPos.x, foodPos.y, centerX, centerY + 80);[cite: 3]
                if (dToMouth < 220) {[cite: 3]
                    isMouthOpen = true; [cite: 3]
                } else {[cite: 3]
                    isMouthOpen = false;[cite: 3]
                }
            } else if (!isEatingActive) {[cite: 3]
                isMouthOpen = false;[cite: 3]
            }

            // ==================== 🎨 레이어 순서 구역 ====================[cite: 3]
            drawMarquee();[cite: 3]
            drawTable(centerX, centerY);[cite: 3]
            drawPlateImage(platePos.x, platePos.y);[cite: 3]
            drawUncleImage(centerX, centerY);[cite: 3]
            drawBoard(width - 350, height / 2 - 100); [cite: 3]

            if (!isEatingActive) {[cite: 3]
                drawFoodImage(foodPos.x, foodPos.y, currentFood);[cite: 3]
            }

            if (!isEatingActive) {[cite: 3]
                drawChopsticks();[cite: 3]
            }
        }[cite: 3]

        function drawChopsticks() {[cite: 3]
            let targetChopstick = imgChopstick1; [cite: 3]
            if (isDragging && !hasFood) {[cite: 3]
                let dToFood = dist(chopstickPos.x, chopstickPos.y, foodPos.x, foodPos.y);[cite: 3]
                if (dToFood > 40 && dToFood < 150) {[cite: 3]
                    targetChopstick = imgChopstick2; [cite: 3]
                }
            }
            if (targetChopstick) {[cite: 3]
                image(targetChopstick, chopstickPos.x, chopstickPos.y, 200, 100);[cite: 3]
            }
        }[cite: 3]

        function drawTable(centerX, centerY) {[cite: 3]
            if (imgTable) {[cite: 3]
                push(); [cite: 3]
                imageMode(CORNER); [cite: 3]
                let tableX = 0;[cite: 3]
                let tableY = height - 540; [cite: 3]
                image(imgTable, tableX, tableY, width, 540); [cite: 3]
                pop(); [cite: 3]
            }
        }[cite: 3]

        function drawBoard(x, y) {[cite: 3]
            if (imgBoard) {[cite: 3]
                image(imgBoard, x, y, 400, 350); [cite: 3]
            }
        }
        
        function drawMarquee() {[cite: 3]
            push();[cite: 3]
            fill(230); noStroke(); rect(0, 20, width, 100);[cite: 3]
            fill(50); textSize(50); textAlign(LEFT, CENTER);[cite: 3]
            text(marqueeText, marqueeX, 75);[cite: 3]
            if (frameCount % 8 === 0) { marqueeX -= 25; }[cite: 3]
            if (marqueeX < -1500) marqueeX = width;[cite: 3]
            pop();[cite: 3]
        }[cite: 3]

        // 접시 이미지 출력 함수[cite: 3]
        function drawPlateImage(x, y) {[cite: 3]
            if (imgPlate) {[cite: 3]
                image(imgPlate, x, y, 280, 200); [cite: 3]
            }
        }[cite: 3]

        // 아저씨 이미지 출력 함수[cite: 3]
        function drawUncleImage(x, y) {[cite: 3]
            let targetImg = imgUncleIdle; [cite: 3]
            if (isEatingActive) {[cite: 3]
                if (faceStatus === "angry") targetImg = imgUncleAngry;[cite: 3]
                else if (faceStatus === "cry") targetImg = imgUncleCry;[cite: 3]
            } else if (isMouthOpen) {[cite: 3]
                targetImg = imgUncleOpen; [cite: 3]
            }
            if (targetImg) {[cite: 3]
                image(targetImg, x, y, 900, 550); [cite: 3]
            }
        }[cite: 3]

        // 음식 이미지 출력 함수[cite: 3]
        function drawFoodImage(x, y, type) {[cite: 3]
            let foodImg = imgMandoo;  [cite: 3]
            let foodWidth = 110;[cite: 3]
            let foodHeight = 110;[cite: 3]

            if (type === "mandoo") {[cite: 3]
                foodImg = imgMandoo;[cite: 3]
                foodWidth = 110;   [cite: 3]
                foodHeight = 110;  [cite: 3]
            } else if (type === "golden") {[cite: 3]
                foodImg = imgGolden;[cite: 3]
                foodWidth = 140;   [cite: 3]
                foodHeight = 140;  [cite: 3]
            } else if (type === "shoes") {[cite: 3]
                foodImg = imgShoes;[cite: 3]
                foodWidth = 160;   [cite: 3]
                foodHeight = 100;  [cite: 3]
            }

            if (foodImg) {[cite: 3]
                image(foodImg, x, y, foodWidth, foodHeight); [cite: 3]
            }
        }
        
        function mousePressed() {[cite: 3]
            if (isEatingActive || !chopstickPos) return;  [cite: 3]
            
            let d = dist(mouseX, mouseY, chopstickPos.x, chopstickPos.y);[cite: 3]
            if (d < 80) isDragging = true;[cite: 3]
        }

        function mouseDragged() {[cite: 3]
        }

        function mouseReleased() {[cite: 3]
            if (isDragging) {[cite: 3]
                isDragging = false;[cite: 3]
                
                let centerX = width / 2 - 100; [cite: 3]
                let centerY = height / 2 - 40; [cite: 3]
                
                if (hasFood && foodPos) { 
                    let d = dist(foodPos.x, foodPos.y, centerX, centerY + 80);[cite: 3]
                    
                    if (d < 160) { [cite: 3]
                        isEatingActive = true;[cite: 3]
                        actionTimer = millis();  [cite: 3]
                        
                        if (currentFood === "mandoo") {[cite: 3]
                            faceStatus = "idle";[cite: 3]
                            marqueeText = " 우물우물... 평범한 만두군.";[cite: 3]
                        } else if (currentFood === "shoes") {[cite: 3]
                            faceStatus = "angry";[cite: 3]
                            marqueeText = " 이게 지금 장난하자는 거야?";[cite: 3]
                        } else if (currentFood === "golden") {[cite: 3]
                            faceStatus = "cry";[cite: 3]
                            marqueeText = " 오오옷!! 천하일미 로구만!!";[cite: 3]
                        }[cite: 3]
                        marqueeX = width - 600; [cite: 3]
                        
                        isMouthOpen = false;[cite: 3]
                    } else {[cite: 3]
                        backToPlate();[cite: 3]
                    }
                } else {[cite: 3]
                    backToPlate();[cite: 3]
                }
            }
        }

        function backToPlate() {[cite: 3]
            if (!platePos || !foodPos || !chopstickPos) return;
            hasFood = false;[cite: 3]
            foodPos.set(platePos.x, platePos.y - 15);[cite: 3]
            chopstickPos.set(platePos.x + 30, platePos.y - 40);[cite: 3]
            marqueeText = " 출출하구먼...                     꼬르륵~~                     젓가락은 뒀다가 뭐해?";[cite: 3]
        }

        function resetFood() {[cite: 3]
            if (!platePos || !foodPos || !chopstickPos) return;
            hasFood = false;[cite: 3]
            foodPos.set(platePos.x, platePos.y - 15);[cite: 3]
            chopstickPos.set(platePos.x + 30, platePos.y - 40);[cite: 3]
            marqueeX = width;[cite: 3]
            marqueeText = " 출출하구먼...                     꼬르륵~~                     젓가락은 뒀다가 뭐해?";[cite: 3]
            
            let types = ["mandoo", "golden", "shoes"];[cite: 3]
            currentFood = random(types);[cite: 3]
        }

        function windowResized() {[cite: 3]
            resizeCanvas(windowWidth, windowHeight);[cite: 3]
            if (platePos) platePos.set(width - 500, height - 200);[cite: 3]
            backToPlate();[cite: 3]
        }
    </script>
</body>
</html>
